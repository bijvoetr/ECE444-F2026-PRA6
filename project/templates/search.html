{% extends "base.html" %}
{% block content %}
<h2>Search</h2>
<form action="{{ url_for('search') }}" method="get">
  <label>Search entries <input type="text" name="query" value="{{ query }}"></label>
  <input type="submit" value="Search">
</form>
{% if query %}
<ul>
{% for entry in entries %}
  <li><h2>{{ entry.title }}</h2>{{ entry.text }}</li>
{% else %}
  <li>No matching entries.</li>
{% endfor %}
</ul>
{% endif %}
{% endblock %}
