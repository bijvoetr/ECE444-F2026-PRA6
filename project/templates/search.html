<!DOCTYPE html>
<html>
<body>

<h1>Search</h1>

<form action="{{ url_for('search') }}" method="get">
    <input type="text" name="query">
    <input type="submit" value="Search">
</form>

<ul>
{% for entry in entries %}
    {% if query.lower() in entry.title.lower() or query.lower() in entry.text.lower() %}
        <li>
            <h2>{{ entry.title }}</h2>
            {{ entry.text }}
        </li>
    {% endif %}
{% endfor %}
</ul>

</body>
</html>
